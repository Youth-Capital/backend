# Youth Capital — nginx site configuration.
#
# The chain is: Internet -> nginx (TLS, limits, static) -> gunicorn on the
# loopback interface -> Django. nginx is the only thing that listens on a
# public port; see deploy/gunicorn/gunicorn.conf.py for the other half of
# that arrangement, and deploy/README.md for installation and verification.
#
# PLACEHOLDERS — replace all three before `nginx -t`:
#   __DOMAIN__          the public hostname, e.g. youthcapital.uz
#   __FRONTEND_ROOT__   directory holding the built SPA (contents of
#                       frontend/dist), e.g. /srv/youth-capital/frontend
#   __BACKEND_DIR__     the backend checkout, e.g. /srv/youth-capital/backend
#
# This file belongs in /etc/nginx/conf.d/ or /etc/nginx/sites-available/ with a
# link from sites-enabled/. Both are included from inside `http{}`, which is
# where the three zones below have to live.

# ---------------------------------------------------------------------------
# Rate limiting
# ---------------------------------------------------------------------------
# Keyed on $binary_remote_addr — the address nginx accepted the connection
# from. At this point in the chain that is the real client, and nothing it
# sends can change it.
#
# A caution specific to this audience: mobile networks in Uzbekistan put very
# many subscribers behind one carrier address, so a limit tight enough to stop
# one attacker can lock a whole city out of signing in. These numbers are
# therefore a flood stop, not the brute-force defence — that one is per
# account, inside Django (django-axes), and it stays there.
#
#   yc_auth  20 requests/minute, bursts of 10. A household retrying a password
#            never notices; a script trying a list of them does.
#   yc_api   20 requests/second, bursts of 40. A dashboard opens a dozen
#            requests at once, which is why the burst is wide.
limit_req_zone $binary_remote_addr zone=yc_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=yc_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=yc_conn:10m;

# 429 rather than nginx's default 503: the SPA already understands 429 as
# "slow down", and 503 reads to a monitoring system as "the site is down".
limit_req_status 429;
limit_conn_status 429;

# Do not log every throttled request as an error; a rate limit doing its job
# is not an incident.
limit_req_log_level warn;

upstream youth_capital_app {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# Port 80: certificates and the redirect, nothing else
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;

    # Certbot's webroot challenge. Must stay on plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 443: the site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    # `http2 on;` exists only from nginx 1.25.1. On anything older — Ubuntu
    # 22.04 ships 1.18, Debian 12 ships 1.22, Ubuntu 24.04 ships 1.24 — it is
    # an unknown directive and nginx refuses to start. Check with
    # `nginx -v` and use the form that matches:
    #
    #   1.25.1 and newer : keep the line below
    #   older            : delete it and write the two listen lines above as
    #                      `listen 443 ssl http2;` / `listen [::]:443 ssl http2;`
    http2 on;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    charset utf-8;

    root __FRONTEND_ROOT__;
    index index.html;

    # --- request size ------------------------------------------------------
    #
    # The default for the whole site is small. Uploads are allowed only where
    # the platform actually accepts files, in the location block further down.
    # nginx's own default is 1 MB, which would have refused every course book
    # (40 MB) with a 413 the application never sees.
    client_max_body_size 2m;
    client_body_buffer_size 64k;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;

    limit_conn yc_conn 24;

    # --- what is never served ---------------------------------------------
    #
    # The private upload root is outside this document root already; this is
    # the second lock. CVs, portfolios, certificates and paid course material
    # live there and are reachable only through the platform's download view,
    # which checks who is asking. `^~` stops nginx looking at any regex
    # location below, so nothing can re-open this by accident.
    location ^~ /private-media/ {
        access_log off;
        return 404;
    }

    # .env, .git, editor backups — anything dotted. Kept above the dotfile
    # rule so ACME renewal still works over HTTPS.
    location ^~ /.well-known/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location ~ /\. {
        access_log off;
        return 404;
    }

    # --- credential endpoints ---------------------------------------------
    #
    # Sign-in, registration, the password flows and email verification.
    # Listed before the other regex locations so it wins for these paths.
    # Bodies here are small JSON objects; 64k is already generous, and it
    # keeps the wide upload limit away from the one place an attacker sends
    # many requests on purpose.
    #
    # Deliberately excluded: /api/v1/auth/refresh/. Every page load spends
    # one, and several browser tabs spend several — a per-minute limit there
    # would end people's sessions for using the site normally. It keeps the
    # ordinary API rate below.
    #
    # email/verify/ is here because it consumes a token and, unlike the
    # others, has no tighter limit of its own inside Django: it falls back to
    # the shared anonymous rate. This block is currently the only thing
    # slowing down guesses at a verification token.
    location ~ ^/api/v1/auth/(login|register|password|email/verify)/ {
        limit_req zone=yc_auth burst=10 nodelay;
        client_max_body_size 64k;
        include snippets/youth-capital-proxy.conf;
    }

    # --- lesson videos ----------------------------------------------------
    #
    # The one endpoint that takes a file measured in hundreds of megabytes:
    # a lesson video uploaded from the author's own computer, capped by the
    # application at MAX_VIDEO_SIZE_MB (500 MB in config/settings/base.py).
    # 520m leaves room for the multipart envelope around it.
    #
    # These two numbers have to move together. If the setting is raised and
    # this is not, nginx answers 413 and the application never learns that
    # anything was attempted; if this is raised and the setting is not, the
    # visitor waits out the whole upload before being told it was too large.
    #
    # The timeouts here are the upload's, not the site's: after nginx has
    # buffered the body, Django still has to write half a gigabyte to disk.
    # Gunicorn's own `timeout` (60s, deploy/gunicorn/gunicorn.conf.py) is the
    # remaining ceiling — if large videos start failing with 504, that is the
    # number to look at, not this one.
    location ~ ^/api/v1/learning/materials/ {
        limit_req zone=yc_api burst=40 nodelay;
        client_max_body_size 520m;
        client_body_timeout 120s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        include snippets/youth-capital-proxy.conf;
    }

    # --- the parts of the API that accept files ---------------------------
    #
    # learning: course covers, materials, books, lesson video files
    # cv:       portfolio items and their covers
    # experience: project assets
    # me:       avatars and employer logos
    #
    # 45m covers the 40 MB book limit with room for the multipart envelope.
    # The per-field caps are enforced by the application
    # (apps/common/validators.py: 5 MB images and documents, 40 MB books), and
    # since DRF 3.17.2 Django also enforces DATA_UPLOAD_MAX_MEMORY_SIZE on
    # JSON and form bodies, so a large limit here is not a large limit there.
    #
    # If a new endpoint starts accepting uploads and is not under one of these
    # four prefixes, it will answer 413 above 2 MB. Add the prefix here.
    location ~ ^/api/v1/(learning|cv|experience|me)/ {
        limit_req zone=yc_api burst=40 nodelay;
        client_max_body_size 45m;
        include snippets/youth-capital-proxy.conf;
    }

    # --- the rest of the API ----------------------------------------------
    location /api/ {
        limit_req zone=yc_api burst=40 nodelay;
        include snippets/youth-capital-proxy.conf;
    }

    # --- Django admin ------------------------------------------------------
    #
    # Reachable, rate limited, and a good candidate for an address allowlist:
    # uncomment the two lines and put your own addresses in if they are
    # static. django-axes protects the login either way.
    location /django-admin/ {
        # allow 203.0.113.0/24;
        # deny all;
        limit_req zone=yc_auth burst=10 nodelay;
        # Course material, books and lesson videos can all be attached from
        # the admin, so this matches the video endpoint's limit rather than
        # the smaller one — otherwise the admin is the one place a 500 MB
        # video is refused.
        client_max_body_size 520m;
        client_body_timeout 120s;
        proxy_read_timeout 300s;
        include snippets/youth-capital-proxy.conf;
    }

    # --- collected static (Django admin CSS, API docs assets) -------------
    location /static/ {
        alias __BACKEND_DIR__/staticfiles/;
        access_log off;
        # Names are content-hashed by WhiteNoise's manifest storage.
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/youth-capital-security-headers.conf;
    }

    # --- public uploads ----------------------------------------------------
    #
    # Avatars, employer logos and course covers, which are public by design.
    # Serving them here is also what makes them appear at all: in production
    # Django does not serve MEDIA_ROOT and WhiteNoise serves only the static
    # root, so without this block every avatar on the site is a broken image.
    #
    # Note for housekeeping: this directory still holds 139 files left over
    # from earlier demo seeding, verified to be referenced by nothing. They
    # are publicly readable once this block exists. Deleting them is a
    # decision of yours, not something this configuration should make.
    location /media/ {
        alias __BACKEND_DIR__/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        include snippets/youth-capital-uploads.conf;
        # Directory listings, in case a path resolves to a folder.
        autoindex off;
    }

    # --- the application shell --------------------------------------------
    #
    # index.html is never cached: it names the hashed asset files, so a cached
    # copy pins a visitor to the previous deploy's JavaScript.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        include snippets/youth-capital-security-headers.conf;
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/youth-capital-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include snippets/youth-capital-security-headers.conf;
    }

    # Compression. Uploads are already compressed formats and are left alone.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # If this nginx was built with ngx_http_gzip_static_module, WhiteNoise's
    # pre-compressed .gz files can be served as they are. Uncomment only after
    # `nginx -V 2>&1 | grep -o with-http_gzip_static_module` prints something;
    # otherwise nginx refuses to start.
    # gzip_static on;
}
