# How every request handed to gunicorn is described to it.
#
# Included by each proxying location in youth-capital.conf. One file, because
# the headers below are a contract with Django and a copy of them that drifts
# is a security bug rather than an inconsistency: the platform decides who a
# request came from by reading exactly these headers.

proxy_pass http://youth_capital_app;
proxy_http_version 1.1;
proxy_set_header Connection "";

# The Host the visitor typed. Django validates it against ALLOWED_HOSTS and
# builds absolute links from it — signed download links among them — so
# $proxy_host (127.0.0.1:8000) would both fail the check and produce links
# that point at the loopback interface.
proxy_set_header Host $host;

# --- who the client is -----------------------------------------------------
#
# $remote_addr, not $proxy_add_x_forwarded_for.
#
# The append form that almost every guide shows keeps whatever the client sent
# and puts the real peer after it. Overwriting instead is what makes the header
# trustworthy: whatever arrived is discarded here, and the single entry Django
# sees is the address nginx accepted the connection from.
#
# The application counts from the right-hand end of this header, one entry per
# trusted proxy (`TRUSTED_PROXY_COUNT`, 1 in production) — the rate limits, the
# lockout after failed sign-ins and the audit log all through the same
# function. So the two halves have to agree: that setting says how many entries
# at the end of the header were written by infrastructure rather than by the
# caller, and this file is what makes that true.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;

# Headers a client might send to describe the chain itself. We do not use any
# of them, so they are cleared rather than relayed: a header that reaches the
# application unexamined is a header someone will eventually start trusting.
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Original-Forwarded-For "";
proxy_set_header CF-Connecting-IP "";
proxy_set_header True-Client-IP "";

# --- how the client reached us --------------------------------------------
#
# $scheme is this server block's own protocol, so it cannot be spoofed from
# outside. Django trusts this header (SECURE_PROXY_SSL_HEADER) to decide
# whether the request was already secure; that trust is only sound because
# gunicorn listens on the loopback interface and nothing but nginx can reach
# it. See deploy/gunicorn/gunicorn.conf.py.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port $server_port;

# --- timeouts and buffering ----------------------------------------------
proxy_redirect off;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Read the whole request body before opening the connection to gunicorn. The
# workers are synchronous: without this, one visitor uploading a 40 MB book
# over a slow phone connection occupies a worker for the whole upload, and a
# handful of deliberately slow uploads would occupy all of them.
proxy_request_buffering on;
proxy_buffering on;
