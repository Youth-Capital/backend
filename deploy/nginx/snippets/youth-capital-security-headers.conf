# Security headers for everything nginx answers itself: the SPA and its assets.
#
# Django sends its own set on API and admin responses (config/settings/prod.py),
# and `add_header` does not inherit into a location that declares its own, so
# this file is included only in the locations nginx serves directly. That is
# deliberate — including it on the API locations too would send every header
# twice.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Content Security Policy for the application shell.
#
# script-src carries a hash rather than 'unsafe-inline' because index.html has
# one inline script: the theme is applied before first paint, otherwise a
# viewer on a dark system gets a white flash on every load. The hash is of
# that script's exact bytes.
#
#   IF YOU EDIT THE INLINE SCRIPT IN frontend/index.html, RECOMPUTE THE HASH:
#   python -c "import base64,hashlib,re,pathlib,sys; h=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'); [print('sha256-'+base64.b64encode(hashlib.sha256(m.group(1).encode()).digest()).decode()) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', h, re.S)]" frontend/dist/index.html
#
# The page will go blank if the hash is stale — a broken theme script means no
# React either. Verify after every frontend deploy that changes index.html.
#
# style-src allows 'unsafe-inline' and script-src does not, which is the usual
# split for a React build: React 19 can hoist a <style> element of its own, and
# a policy that blanks the interface is a policy that gets switched off. The
# protection that matters against injected markup is on script-src, and that
# one is strict. A Report-Only line to test tightening this is at the bottom.
#
# frame-src lists the two video hosts and nothing else. Lesson videos are
# embedded in an iframe by the SPA, and the address always comes from
# apps/learning/video.py, which builds one on exactly these hosts. Both halves
# of that guard have to agree or lesson videos go blank in production only.
#
# connect-src is 'self' because the API is served from this same origin, under
# /api/. If the API ever moves to its own hostname, add it here — the SPA will
# otherwise be unable to reach it, and the browser reports it as a CSP block.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-ixCFgP4gMudXZeyrA6MoJ5aXAJUj5Rna6lYhFMqcDzY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# Optional, for tightening later: uncomment to find out whether the build
# really needs 'unsafe-inline' for styles. Report-Only blocks nothing; it makes
# the browser console name every violation instead. If nothing is reported
# while clicking through charts, lessons and the passport, move the strict
# value into the enforcing header above.
# add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-ixCFgP4gMudXZeyrA6MoJ5aXAJUj5Rna6lYhFMqcDzY='; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'" always;
