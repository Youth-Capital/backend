# Headers for files a person uploaded, served straight off disk.
#
# Only the public root (MEDIA_ROOT: avatars, employer logos, course covers) is
# ever served this way. Private uploads live outside anything nginx publishes
# and are reachable only through the platform's own download view, which asks
# whether the person may have the file.
#
# Uploaded bytes are somebody else's content served from our origin, so they
# are served as inertly as possible: nothing may execute, nothing may be
# reinterpreted as a document, and nothing may frame or embed it elsewhere.
# The validators only admit JPEG, PNG and WebP, and this is the second half of
# that rule — the half that still holds if a validator is ever loosened.

add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
