[project]
name = "youth-capital-backend"
version = "0.1.0"
description = "Youth Capital Django API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==5.2.17",
    "djangorestframework==3.17.2",
    "djangorestframework-simplejwt==5.5.1",
    "psycopg[binary]==3.3.6",
    "dj-database-url==3.0.1",
    "django-environ==0.12.0",
    "django-filter==25.1",
    "drf-spectacular==0.28.0",
    "django-cors-headers==4.7.0",
    "argon2-cffi==25.1.0",
    "django-axes==8.0.0",
    "Pillow==12.3.0",
    "python-dateutil==2.9.0.post0",
    "anthropic==1.13.0",
    "gunicorn==26.2.0",
    "whitenoise[brotli]==6.12.0",
    "django-csp==4.0",
    "sentry-sdk[django]==2.72.0",
    "redis==8.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "model-bakery==1.24.2",
    "ruff==0.17.0",
    "django-extensions==4.1",
]

[tool.uv]
package = false
required-version = "==0.13.0"

[tool.ruff]
target-version = "py314"
