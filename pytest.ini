[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
# Only classes written as tests, not every model that happens to be called
# Test. The assessment app has a Test model, and pytest kept reporting that it
# could not collect it — a warning about nothing, printed on every run, which
# is how real warnings get missed.
python_classes = Test[A-Z]* Describe*
testpaths = apps
addopts = --strict-markers --tb=short -q
filterwarnings =
    ignore::DeprecationWarning
