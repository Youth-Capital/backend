name: Registry maintenance
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-release
  cancel-in-progress: false
  queue: max

jobs:
  cleanup-ghcr:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: prod
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    env:
      INFRA_REPO: ${{ vars.INFRA_REPO }}
      GHCR_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Create infra token
        id: infra-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: Youth-Capital
          repositories: infra
          permission-contents: read
      - name: Retain newest two and infra desired image
        run: node .github/scripts/release.mjs maintenance
        env:
          INFRA_TOKEN: ${{ steps.infra-token.outputs.token }}
