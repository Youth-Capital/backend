source = { virtual = "." }
dependencies = [
    { name = "anthropic" },
    { name = "argon2-cffi" },
    { name = "dj-database-url" },
    { name = "django" },
    { name = "django-axes" },
    { name = "django-cors-headers" },
    { name = "django-csp" },
    { name = "django-environ" },
    { name = "django-filter" },
    { name = "djangorestframework" },
    { name = "djangorestframework-simplejwt" },
    { name = "drf-spectacular" },
    { name = "gunicorn" },
    { name = "pillow" },
    { name = "psycopg", extra = ["binary"] },
    { name = "python-dateutil" },
    { name = "redis" },
    { name = "sentry-sdk", extra = ["django"] },
    { name = "whitenoise", extra = ["brotli"] },
]

[package.dev-dependencies]
dev = [
    { name = "django-extensions" },
    { name = "model-bakery" },
    { name = "pytest" },
    { name = "pytest-cov" },
    { name = "pytest-django" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "anthropic", specifier = "==1.13.0" },
    { name = "argon2-cffi", specifier = "==25.1.0" },
    { name = "dj-database-url", specifier = "==3.0.1" },
    { name = "django", specifier = "==5.2.17" },
    { name = "django-axes", specifier = "==8.0.0" },
    { name = "django-cors-headers", specifier = "==4.7.0" },
    { name = "django-csp", specifier = "==4.0" },
    { name = "django-environ", specifier = "==0.12.0" },
    { name = "django-filter", specifier = "==25.1" },
    { name = "djangorestframework", specifier = "==3.17.2" },
    { name = "djangorestframework-simplejwt", specifier = "==5.5.1" },
    { name = "drf-spectacular", specifier = "==0.28.0" },
    { name = "gunicorn", specifier = "==26.2.0" },
    { name = "pillow", specifier = "==12.3.0" },
    { name = "psycopg", extras = ["binary"], specifier = "==3.3.6" },
    { name = "python-dateutil", specifier = "==2.9.0.post0" },
    { name = "redis", specifier = "==8.1.0" },
    { name = "sentry-sdk", extras = ["django"], specifier = "==2.72.0" },
    { name = "whitenoise", extras = ["brotli"], specifier = "==6.12.0" },
]

[package.metadata.requires-dev]
dev = [
    { name = "django-extensions", specifier = "==4.1" },
    { name = "model-bakery", specifier = "==1.24.2" },
    { name = "pytest", specifier = "==9.1.1" },
    { name = "pytest-cov", specifier = "==7.1.0" },
    { name = "pytest-django", specifier = "==4.14.0" },
    { name = "ruff", specifier = "==0.17.0" },
]
